name: fixed-q-preprint

on:
  pull_request:
    paths:
      - '.github/workflows/fixed-q-preprint.yml'
      - 'experiments/audit_fixed_q_preprint.py'
      - 'notes/QUASIPRIMAL_CONSERVATIVE_TERM_*.md'
      - 'paper/FIXED_Q_TERM_COMPLEXITY_DRAFT.md'
      - 'research/tournaments/2026-08-13-semantic-router-frontier/**'
      - 'research/tournaments/2026-08-13-program-vector-optimization/**'
      - 'research/tournaments/2026-08-14-two-slice-compiler/**'
      - 'research/tournaments/2026-08-14-early-switch-compiler/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          test: false
          use-mathlib-cache: true
          build-args: '--wfail'
      - name: Replay exact evidence and Lean proofs
        run: |
          python3 experiments/audit_fixed_q_preprint.py
          bash research/tournaments/2026-08-13-program-vector-optimization/lanes/fast_anchor_sharp_bounds/check.sh
          bash research/tournaments/2026-08-14-two-slice-compiler/check.sh
          bash research/tournaments/2026-08-14-early-switch-compiler/check.sh
