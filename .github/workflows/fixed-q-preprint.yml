name: fixed-q-preprint

on:
  pull_request:
    paths:
      - '.github/workflows/fixed-q-preprint.yml'
      - 'experiments/audit_fixed_q_preprint.py'
      - 'experiments/audit_native_router_refinement.py'
      - 'notes/QUASIPRIMAL_CONSERVATIVE_TERM_*.md'
      - 'paper/FIXED_Q_TERM_COMPLEXITY_DRAFT.md'
      - 'paper/NATIVE_FIND_FIRST_ROUTER_*.md'
      - 'research/tournaments/2026-08-13-semantic-router-frontier/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          test: false
          use-mathlib-cache: true
          build-args: '--wfail'
      - name: Replay frozen preprint evidence and Lean proofs
        run: python3 experiments/audit_fixed_q_preprint.py
      - name: Replay native router refinement evidence and Lean proofs
        run: python3 experiments/audit_native_router_refinement.py
      - name: Replay exact order-pair vectors and Lean proofs
        run: bash research/tournaments/2026-08-13-semantic-router-frontier/lanes/order_pair_program_vector/check.sh
