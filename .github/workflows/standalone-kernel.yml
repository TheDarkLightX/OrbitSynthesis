name: standalone-kernel

on:
  push:
    branches:
      - main
      - agent/frontier-program-v0
  pull_request:

jobs:
  semantic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile standalone kernel
        run: python -m compileall -q src/orbitsynthesis experiments/standalone_kernel_smoke.py
      - name: Run theorem-shaped smoke tests
        run: python experiments/standalone_kernel_smoke.py
