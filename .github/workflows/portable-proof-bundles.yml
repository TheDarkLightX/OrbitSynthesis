name: portable-proof-bundles

on:
  pull_request:
    paths:
      - '.github/workflows/portable-proof-bundles.yml'
      - 'README.md'
      - 'src/orbitsynthesis/problem_io.py'
      - 'src/orbitsynthesis/proof_bundle.py'
      - 'src/orbitsynthesis/proof_bundle_io.py'
      - 'src/orbitsynthesis/state_optimality_certificate.py'
      - 'src/orbitsynthesis/domain_model.py'
      - 'src/orbitsynthesis/domain_optimization.py'
      - 'src/orbitsynthesis/external_optimization.py'
      - 'src/orbitsynthesis/__init__.py'
      - 'tools/orbit_synthesize.py'
      - 'schemas/finite_safety_problem_v1.schema.json'
      - 'schemas/proof_bundle_v1.schema.json'
      - 'examples/proof_bundle/**'
      - 'notes/PORTABLE_PROOF_BUNDLES.md'
      - 'research/tournaments/2026-08-15-portable-proof-bundles/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-portable-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact backend dependency
        run: python -m pip install --upgrade scipy
      - name: Replay portable synthesis and verification
        run: bash research/tournaments/2026-08-15-portable-proof-bundles/check.sh
