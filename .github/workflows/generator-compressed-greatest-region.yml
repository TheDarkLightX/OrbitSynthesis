name: generator-compressed-greatest-region

on:
  pull_request:
    paths:
      - '.github/workflows/generator-compressed-greatest-region.yml'
      - 'src/orbitsynthesis/generator_compressed_witness.py'
      - 'src/orbitsynthesis/__init__.py'
      - 'notes/DEMI_SEMIPRIMAL_GENERATOR_COMPRESSED_WITNESS.md'
      - 'research/tournaments/2026-08-15-generator-compressed-converse/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-generator-compression-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay primary and independent compressed witnesses
        run: bash research/tournaments/2026-08-15-generator-compressed-converse/check.sh
