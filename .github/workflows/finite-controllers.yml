name: finite-controller-checker
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  exhaustive-checker-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay independent oracles and fault controls
        run: python3 -B research/prototypes/2026-09-12-strategy-checker/check.py
