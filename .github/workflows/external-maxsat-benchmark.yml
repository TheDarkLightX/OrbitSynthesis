name: external-maxsat-benchmark

on:
  pull_request:
    paths:
      - '.github/workflows/external-maxsat-benchmark.yml'
      - 'notes/EXTERNAL_EXACT_OPTIMIZATION_BACKENDS.md'
      - 'src/orbitsynthesis/__init__.py'
      - 'src/orbitsynthesis/domain_model.py'
      - 'src/orbitsynthesis/domain_solver.py'
      - 'src/orbitsynthesis/domain_optimization.py'
      - 'src/orbitsynthesis/external_optimization.py'
      - 'research/tournaments/2026-08-14-external-maxsat-benchmark/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-external-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional exact backends
        run: python -m pip install --upgrade scipy python-sat
      - name: Replay native, HiGHS, command, PySAT, and no-import gates
        run: |
          bash research/tournaments/2026-08-14-external-maxsat-benchmark/check.sh \
            --require-pysat
      - name: Run diagnostic backend benchmark
        run: |
          PYTHONPATH=src python \
            research/tournaments/2026-08-14-external-maxsat-benchmark/benchmark_external_optimization.py \
            --repeat 3 \
            --require-pysat \
            --out external-optimization-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-optimization-benchmark
          path: external-optimization-benchmark.json
