name: research-checks

on:
  pull_request:

jobs:
  python-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ABA type-space oracle
        run: python experiments/aba_types.py
      - name: ABA ocLTL projection fibers
        run: python experiments/aba_ocltl_fibers.py
      - name: ABA atomic group testing
        run: python experiments/aba_group_testing.py
      - name: ABA support ROBDD projection
        run: python experiments/aba_support_bdd.py
      - name: ABA ocLTL feasibility ROBDD
        run: python experiments/aba_ocltl_feasibility_bdd.py
      - name: ABA closed-form clause projection
        run: python experiments/aba_clause_projection.py
      - name: ABA alternating clause quantifier elimination
        run: python experiments/aba_alternating_clause_qe.py
      - name: ABA safety clause game
        run: python experiments/aba_safety_clause_game.py
      - name: ABA Bekić safety decomposition
        run: python experiments/aba_safety_bekic.py
      - name: ABA compact LFSR lower bound
        run: python experiments/aba_lfsr_lower_bound.py
      - name: ABA symmetric histogram quotient
        run: python experiments/aba_symmetry_quotient.py
      - name: ABA positive reachability and Buchi calculus
        run: python experiments/aba_positive_mu_calculus.py
      - name: Dyadic ABA constructive witnesses
        run: python experiments/dyadic_aba_witness.py
      - name: Quasi-primal pointed-orbit factorization
        run: python experiments/quasiprimal_pointed_orbit_factorization.py

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: false
          use-mathlib-cache: true
          build-args: "--wfail"
