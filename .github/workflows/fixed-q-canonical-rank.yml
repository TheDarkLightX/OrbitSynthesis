name: fixed-q-canonical-rank

on:
  pull_request:
    paths:
      - '.github/workflows/fixed-q-canonical-rank.yml'
      - 'notes/QUASIPRIMAL_CONSERVATIVE_TERM_CANONICAL_RANK_LIBRARY.md'
      - 'research/tournaments/2026-08-14-canonical-rank-library/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-rank-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay primary and independent canonical-rank evidence
        run: bash research/tournaments/2026-08-14-canonical-rank-library/check.sh
