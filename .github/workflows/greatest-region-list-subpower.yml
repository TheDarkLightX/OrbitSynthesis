name: greatest-region-list-subpower

on:
  pull_request:
    paths:
      - '.github/workflows/greatest-region-list-subpower.yml'
      - 'src/orbitsynthesis/finite_algebra.py'
      - 'src/orbitsynthesis/patchability.py'
      - 'src/orbitsynthesis/safety.py'
      - 'src/orbitsynthesis/subpower_lists.py'
      - 'src/orbitsynthesis/greatest_region_boundary.py'
      - 'src/orbitsynthesis/principal_greatest_region.py'
      - 'src/orbitsynthesis/safety_components.py'
      - 'src/orbitsynthesis/domain_model.py'
      - 'src/orbitsynthesis/domain_solver.py'
      - 'src/orbitsynthesis/solver_adapter.py'
      - 'src/orbitsynthesis/__init__.py'
      - 'notes/DEMI_SEMIPRIMAL_GREATEST_REGION_CHARACTERIZATION.md'
      - 'notes/QUASIPRIMAL_LIST_SUBPOWER_TRACTABILITY.md'
      - 'notes/QUASIPRIMAL_DOMAIN_MAXSAT_COMPILATION.md'
      - 'notes/QUASIPRIMAL_DOMAIN_SOLVER_CERTIFICATES.md'
      - 'notes/QUASIPRIMAL_EXTERNAL_SOLVER_ADAPTER.md'
      - 'research/tournaments/2026-08-14-greatest-region-list-subpower/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-frontier-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay mathematical frontiers and portable backends
        run: |
          bash research/tournaments/2026-08-14-greatest-region-list-subpower/check.sh
          bash research/tournaments/2026-08-14-greatest-region-list-subpower/check_solver_adapter.sh
